<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: system-ui, sans-serif; background: #f5f5f7; color: #1d1d1f; display: flex; flex-direction: column; }
    .header { background: #fff; padding: 0.5rem 1.5rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #d1d1d6; }
    .header h1 { font-size: 0.85rem; font-weight: 500; color: #86868b; }
    .status { font-size: 0.7rem; color: #34c759; display: flex; align-items: center; gap: 0.4rem; }
    .status::before { content: ''; width: 6px; height: 6px; background: #34c759; border-radius: 50%; }
    .main { flex: 1; display: flex; align-items: center; justify-content: center; }
    .msg { text-align: center; color: #86868b; font-size: 15px; }
  </style>
</head>
<body>
  <div class="header"><h1>Superpowers Brainstorming</h1><div class="status">Connected</div></div>
  <div class="main"><div class="msg">Continuing in terminal…</div></div>
</body>
</html>
